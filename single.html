<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chi tiết sản phẩm — Seoulive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="siteHeader"></div>

<section class="single-product-section py-5">

    <div class="container">

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
                <li class="breadcrumb-item active" id="singleBreadcrumbName" aria-current="page">Sản phẩm</li>
            </ol>
        </nav>
        <div class="text-center py-5" id="singleStatusSection">

            <div class="spinner-border text-danger" role="status" id="singleSpinner">
                <span class="visually-hidden">Đang tải...</span>
            </div>

            <p class="mt-3 mb-2" id="singleStatusText">Đang tải dữ liệu...</p>

            <button type="button" class="btn btn-outline-danger btn-sm d-none" id="singleRetryBtn">
                Thử lại
            </button>

        </div>

        <div class="row g-5 d-none" id="singleProductContent">

            <div class="col-12 col-md-5 text-center position-relative">

                <span id="singleBadge" class="product-badge d-none"></span>

                <img id="singleImage" src="" alt="" class="img-fluid rounded single-product-image">

            </div>

            <div class="col-12 col-md-7">

                <p class="product-brand mb-1" id="singleBrand"></p>

                <h1 class="h3 mb-3" id="singleName"></h1>

                <p class="mb-3 text-muted small">
                    <span id="singleRating"></span>
                    <span class="mx-2">•</span>
                    <span id="singleStock"></span>
                </p>

                <p class="fs-4 mb-4">
                    <del class="original-price me-2" id="singleOriginalPrice"></del>
                    <span class="sale-price" id="singleSalePrice"></span>
                </p>

                <p class="mb-4" id="singleDescription"></p>

                <div class="d-flex flex-wrap gap-2">

                    <button type="button" class="btn btn-dark" id="singleAddToCart">
                        <i class="fa-solid fa-cart-shopping me-2"></i>Add to Cart
                    </button>

                    <button type="button" class="btn btn-outline-secondary" id="singleWishlistBtn">
                        <i class="fa-regular fa-heart me-2" id="singleWishlistIcon"></i>
                        <span id="singleWishlistLabel">Add to Wishlist</span>
                    </button>

                </div>

            </div>

        </div>

    </div>

</section>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
