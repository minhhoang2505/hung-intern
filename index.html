<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terries</title>
    
</head>
<body>

    <h2>Danh sách khách hàng</h2>
    <ul id="userList"></ul>

    <h3 id="total"></h3>

    <script>
        const users = [
            { name: "   hung nguyen   ", role: "Admin" },
            { name: "  Nguyen Van A  ", role: "Editor" },
            { name: "TRAN THI B   ", role: "Contributor" }
        ];

        users.forEach(user => {
            user.name = user.name.trim().toUpperCase();
        });

        const userList = document.getElementById("userList");

        users.forEach(user => {
            const li = document.createElement("li");
            li.textContent = `Nà mè: ${user.name} - Role: ${user.role}`;
            userList.appendChild(li);
        });
        console.log(users);
    </script>

</body>
</html>
