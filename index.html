<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terries</title>
</head>
<body>

    <h2>Danh sách User</h2>
    <ul id="userList"></ul>

    <script>
        const rawUsers = [
            { name: "   hUng nguYen   ", role: "admin" },
            { name: "  NGUYEN Van A  ", role: "editor" },
            { name: "tran THI B   ", role: "contributor" }
        ];

        const userList = document.getElementById("userList");

        rawUsers.forEach(user => {

            let cleanName = user.name.trim().toLowerCase();
            cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
            user.name = cleanName;
            user.username = cleanName.replace(/\s+/g, "").toLowerCase();
          
            const li = document.createElement("li");
            li.textContent = `Tên: ${user.name} - Username: ${user.username}`;

            // Nếu là admin thì tô màu đỏ
            if (user.role === "admin") {
                li.style.color = "red";
            }
            userList.appendChild(li);
        });
        console.log(rawUsers);
    </script>

</body>
</html>
