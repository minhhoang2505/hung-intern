<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Terries</title>
    <style>
        #productGrid{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .card{
            width:250px;
            border:1px solid #ccc;
            padding:15px;
            border-radius:8px;
        }

        .sale-price{
            color:red;
            font-weight:bold;
        }

        .out-stock{
            color:red;
            font-weight:bold;
        }

        button{
            margin-top:10px;
            padding:8px 12px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <div id="productGrid"></div>

    <script>
        const wooProducts = [
            {
                id: 101,
                name: "  áo thun nam Cổ tròn   ",
                discount: 25,
                regular_price: "200000",
                sale_price: "150000",
                stock_status: "instock"
            },
            {
                id: 102,
                name: "Quần Jean Nữ dáng suông ",
                discount: 0,
                regular_price: "350000",
                sale_price: "",
                stock_status: "outofstock"
            },
            {
                id: 103,
                name: "   giày Thể Thao unisex",
                discount: 10,
                regular_price: "500000",
                sale_price: "450000",
                stock_status: "instock"
            }
        ];

        const productGrid = document.getElementById("productGrid");

        wooProducts.forEach(product => {

            let newName = product.name.trim().toLowerCase();
            newName = newName.charAt(0).toUpperCase() + newName.slice(1);
            product.name = newName;

            product.slug = newName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g,"-");

            if(product.sale_price !== ""){
                const regular = Number(product.regular_price);
                const sale = Number(product.sale_price);

                product.discount = Math.round(
                    (regular - sale) / regular * 100
                );
            }
            else{
                product.discount = 0;
            }

            const card = document.createElement("div");
            card.className = "card";

            
            const titleBox = document.createElement("div");
            titleBox.style.display = "flex";
            titleBox.style.justifyContent = "space-between";
            titleBox.style.alignItems = "center";
            titleBox.style.marginBottom = "10px";


            const link = document.createElement("a");
            link.href = `/product/${product.slug}`;
            link.textContent = product.name;


const discount = document.createElement("span");

            if (product.discount > 0) {
                
            discount.textContent = `-${product.discount}%`;
            discount.style.background = "red";
            discount.style.color = "white";
            discount.style.padding = "3px 8px";
            discount.style.borderRadius = "5px";
            discount.style.fontSize = "13px";
        }

            titleBox.appendChild(link);
            titleBox.appendChild(discount);

            card.appendChild(titleBox);

            if(product.sale_price !== ""){

                const oldPrice = document.createElement("del");
                oldPrice.textContent = product.regular_price + "đ";

                const salePrice = document.createElement("span");
                salePrice.className = "sale-price";
                salePrice.textContent = " " + product.sale_price + "đ";

                card.appendChild(oldPrice);
                card.appendChild(document.createElement("br"));
                card.appendChild(salePrice);

            }
            else{

                const price = document.createElement("p");
                price.textContent = product.regular_price + "đ";
                card.appendChild(price);

            }

            card.appendChild(document.createElement("br"));

            if(product.stock_status === "outofstock"){

                const span = document.createElement("span");
                span.className = "out-stock";
                span.textContent = "Hết hàng!";
                card.appendChild(span);

            }
            else{

                const btn = document.createElement("button");
                btn.textContent = "Thêm vào giỏ hàng";
                card.appendChild(btn);

            }

            productGrid.appendChild(card);

        });

        console.log(wooProducts);
    </script>

</body>
</html>
