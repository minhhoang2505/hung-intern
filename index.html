<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terries</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>

<div class="container">

    <input
        type="text"
        id="searchInput"
        placeholder="Tìm kiếm sản phẩm..."
    >

    <div id="filterButtons">
        <button data-category="all">Tất cả</button>
        <button data-category="ao">Áo</button>
        <button data-category="quan">Quần</button>
        <button data-category="giay">Giày & Dép</button>
    </div>

    <div id="productGrid"></div>

    <div id="cartSummary">
        Giỏ hàng:
        <span id="cartCount">0</span> sản phẩm |
        Tổng:
        <span id="cartTotal">0</span> đ
    </div>
    <button id="clearCart">Xóa giỏ hàng</button>
</div>

<script src="main.js"></script>

</body>
</html>
