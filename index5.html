<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terries</title>
    <style>
        #productGrid{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .card{
            width:250px;
            border:1px solid #ccc;
            padding:15px;
            border-radius:8px;
        }

        .sale-price{
            color:red;
            font-weight:bold;
        }

        .out-stock{
            color:red;
            font-weight:bold;
        }

        button{
            margin-top:10px;
            padding:8px 12px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <h2>Danh sách sản phẩm</h2>
    <ul id="productList"></ul>

<script>
const wooProducts = [
    {
        id: 101,
        name: "  áo thun nam Cổ tròn   ",
        regular_price: "200000",
        sale_price: "150000",
        stock_status: "instock"
    },
    {
        id: 102,
        name: "Quần Jean Nữ dáng suông ",
        regular_price: "350000",
        sale_price: "",
        stock_status: "outofstock"
    },
    {
        id: 103,
        name: "   giày Thể Thao unisex",
        regular_price: "500000",
        sale_price: "450000",
        stock_status: "instock"
    }
];

const productList = document.getElementById("productList");

wooProducts.forEach(product => {

    let newName = product.name.trim().toLowerCase();
    newName = newName.charAt(0).toUpperCase() + newName.slice(1);
    product.name = newName;

    product.slug = newName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, "-");

    if (product.sale_price !== "") {
        const regularPrice = Number(product.regular_price);
        const salePrice = Number(product.sale_price);

        product.discount = Math.round(
            (regularPrice - salePrice) / regularPrice * 100
        );
    } else {
        product.discount = 0;
    }

    const li = document.createElement("li");
    li.textContent = `Tên: ${product.name} / Slug: ${product.slug} / Sale Discount: ${product.discount}%`;
    productList.appendChild(li);

     const card = document.createElement("div");
            card.className = "card";

            const link = document.createElement("a");
            link.href = `/product/${product.slug}`;
            link.textContent = product.name;
            card.appendChild(link);

            card.appendChild(document.createElement("br"));

            if(product.sale_price !== ""){

                const oldPrice = document.createElement("del");
                oldPrice.textContent = product.regular_price + "đ";

                const salePrice = document.createElement("span");
                salePrice.className = "sale-price";
                salePrice.textContent = " " + product.sale_price + "đ";

                card.appendChild(oldPrice);
                card.appendChild(document.createElement("br"));
                card.appendChild(salePrice);

            }else{

                const price = document.createElement("p");
                price.textContent = product.regular_price + "đ";
                card.appendChild(price);

            }

            card.appendChild(document.createElement("br"));

            if(product.stock_status === "outofstock"){

                const span = document.createElement("span");
                span.className = "out-stock";
                span.textContent = "Hết hàng!";
                card.appendChild(span);

            }else{

                const btn = document.createElement("button");
                btn.textContent = "Thêm vào giỏ hàng";
                card.appendChild(btn);

            }

            productGrid.appendChild(card);
});

console.log(wooProducts);
</script>
</body>
</html>
