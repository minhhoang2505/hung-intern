<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>E-books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="wrap">

  <div class="ebooks-top">
    <h1>E-books</h1>
  </div>

  <div class="ebooks-layout">

    <!-- Filters -->
    <aside class="filters">
      <div class="filter-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search for training">
      </div>

      <div class="filter-group">
        <h3>Price</h3>
        <div class="filter-option">
          <label><input type="checkbox">Free</label><span class="count">(3)</span>
        </div>
        <div class="filter-option">
          <label><input type="checkbox">Paid</label><span class="count">(3)</span>
        </div>
      </div>

      <div class="filter-group">
        <h3>Category</h3>
        <div class="filter-option">
          <label><input type="checkbox">Excel</label><span class="count">(1)</span>
        </div>
        <div class="filter-option">
          <label><input type="checkbox">Data Analysis</label><span class="count">(2)</span>
        </div>
        <div class="filter-option">
          <label><input type="checkbox">Programming</label><span class="count">(3)</span>
        </div>
        <div class="filter-group">
        <h3>Technologies</h3>
        <div class="filter-option">
          <label><input type="checkbox">Excel</label><span class="count">(1)</span>
        </div>
        <div class="filter-option">
          <label><input type="checkbox">Python</label><span class="count">(2)</span>
        </div>
        <div class="filter-option">
          <label><input type="checkbox">SPSS</label><span class="count">(1)</span>
        </div>

        <div class="other-tech">
          <button type="button" class="other-tech-btn" id="otherTechBtn">
            Other Technologies <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="other-tech-panel" id="otherTechPanel"></div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main style="flex:1;min-width:0;">

      <div class="toolbar">
        <button class="sort-btn" id="sortBtn">
          <i class="fa-solid fa-arrow-up-short-wide"></i>
          <span id="sortLabel">Newly added</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="sort-menu" id="sortMenu">
          <button class="active" data-label="Newly added">Newly added</button>
          <button data-label="Title (A-Z)">Title (A-Z)</button>
          <button data-label="Title (Z-A)">Title (Z-A)</button>
          <button data-label="Price from high to low">Price from high to low</button>
          <button data-label="Price from low to high">Price from low to high</button>
          <button data-label="Most popular">Most popular</button>
          <button data-label="Average rating">Average rating</button>
        </div>
      </div>

      <div class="book-grid" id="bookGrid">
        <!-- cards injected by JS -->
      </div>

    </main>

  </div>

  <!-- App promo -->
  <section class="app-promo">
    <h2>Data School Application</h2>
    <p>Master data, artificial intelligence, and technology skills from your mobile phone.</p>

    <div class="phones">
      <div><img src="img/backholderbg.jpg" alt=""></div>
    </div>

    <div class="download-block">
      <p>Download the application:</p>
      <div><img src="img/backholderbg.jpg" alt="QR code"></div>
    </div>
  </section>

</div>

<button class="back-to-top" id="backToTop" aria-label="Back to top">
  <i class="fa-solid fa-chevron-up"></i>
</button>
</body>
<script src="app.js"></script>
</html>
